<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弹丸论破跑团规则书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8eb;--paper:#ffffff;--ink:#000000;--muted:#5b5b62;--line:#d2d2d8;--field:#f2f2f4;
  --pink:#f0167d;--pink-soft:#ffe0ee;--on-pink:#ffffff;--on-ink:#ffffff;
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#050506;--paper:#17171b;--ink:#f2f2f4;--muted:#a5a5ac;--line:#3a3a41;--field:#222227;--pink:#ff3b92;--pink-soft:#3b1328;--on-pink:#ffffff;--on-ink:#000000;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#050506;--paper:#17171b;--ink:#f2f2f4;--muted:#a5a5ac;--line:#3a3a41;--field:#222227;--pink:#ff3b92;--pink-soft:#3b1328;--on-pink:#ffffff;--on-ink:#000000;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}

/* ===== 外框 ===== */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{flex:none;display:flex;align-items:center;gap:14px;background:#000;color:#fff;height:56px;position:relative;z-index:30;padding-right:14px}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:var(--pink)}
.menu-btn{align-self:stretch;border:0;background:var(--pink);color:#fff;font-weight:900;font-size:16px;padding:0 30px 0 18px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);cursor:pointer}
.bar-title{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1}
.bar-kick{font-size:13px;font-weight:700;color:#c8c8ce;white-space:nowrap}
.bar-title b{font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-prog{font-weight:900;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.theme-btn{border:2px solid #fff;background:transparent;color:#fff;font-weight:700;font-size:13px;padding:3px 10px;cursor:pointer}
.mode-sw{display:flex;border:2px solid #fff;flex:none}
.mode-sw button{border:0;background:transparent;color:#fff;font-weight:900;font-size:13px;padding:4px 12px;cursor:pointer;min-height:34px;white-space:nowrap}
.mode-sw button[aria-pressed="true"]{background:var(--pink)}
.gm-only{display:inline-block;font-size:12px;font-weight:900;background:#ffd23f;color:#000;padding:1px 8px;margin-right:6px}
.menu{position:fixed;top:61px;left:0;bottom:0;width:min(330px,88vw);background:#000;color:#fff;z-index:45;overflow:auto;padding:8px 0 20px;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);border-right:5px solid var(--pink)}
.menu.open{transform:none}
.menu button{display:flex;width:100%;align-items:baseline;gap:12px;border:0;background:transparent;color:#fff;text-align:left;padding:12px 20px;cursor:pointer}
.menu button small{color:#a9a9b0;font-size:12px;font-weight:700;width:64px;flex:none}
.menu button b{font-size:17px;font-weight:900}
.menu button:hover{background:#222}
.menu button[aria-current="true"]{background:var(--pink)}
.menu button[aria-current="true"] small{color:#fff}
.menu .menu-out{display:flex;width:100%;align-items:baseline;gap:12px;color:#fff;text-decoration:none;padding:12px 20px;margin-top:6px;border-top:2px solid #333}
.menu .menu-out small{color:#a9a9b0;font-size:12px;font-weight:700;width:64px;flex:none}
.menu .menu-out b{font-size:17px;font-weight:900}
.menu .menu-out:hover{background:var(--pink)}
.menu .menu-out:hover small{color:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.scene{flex:1;min-height:0;position:relative;overflow:hidden;margin-top:5px}
.dock{flex:none;display:flex;align-items:stretch;background:var(--paper);border-top:4px solid var(--ink);min-height:98px;position:relative;z-index:20}
.caption{flex:1;min-width:0;padding:12px 20px;font-size:17px;font-weight:500;line-height:1.65;overflow:auto;max-height:30vh}
.caption b{color:var(--pink);font-weight:900}
.caption.typing{animation:capIn .45s ease-out both}
@keyframes capIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ctrl{flex:none;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 14px;border-left:3px solid var(--ink)}
.ctrl-row{display:flex;gap:8px;align-items:center}
.cbtn{min-height:46px;border:3px solid var(--ink);background:var(--paper);font-weight:900;padding:0 16px;cursor:pointer;white-space:nowrap}
.cbtn.primary{background:var(--pink);border-color:var(--pink);color:#fff;padding:0 26px;min-width:120px}
.cbtn:disabled{opacity:.35;cursor:default}
.cbtn.small{min-height:34px;padding:0 10px;font-size:13px;border-width:2px}
.cbtn.unread{position:relative;border-color:var(--pink);color:var(--pink)}
.cbtn.unread::after{content:"！";position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);animation:bell 1.4s ease-in-out infinite}
@keyframes bell{0%,100%{transform:scale(1)}20%{transform:scale(1.22)}40%{transform:scale(1)}}
.stepbar{display:flex;gap:3px;flex-wrap:wrap;max-width:330px}
.stepbar i{width:12px;height:6px;background:var(--line)}
.stepbar i.done{background:var(--ink)}
.stepbar i.on{background:var(--pink)}

/* 细则抽屉 */
.drawer{position:fixed;right:0;top:61px;bottom:0;width:min(440px,92vw);background:var(--paper);border-left:5px solid var(--ink);z-index:45;transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--on-ink);padding:10px 16px}
.drawer header b{font-size:18px;font-weight:900}
.drawer header button{border:2px solid currentColor;background:transparent;color:inherit;font-weight:900;padding:2px 10px;cursor:pointer}
.drawer-body{overflow:auto;padding:14px 18px 30px}
.drawer-body h4{margin:16px 0 6px;font-size:15px;font-weight:900;display:inline-block;background:var(--pink);color:#fff;padding:0 10px}
.drawer-body ul{margin:0;padding-left:20px}
.drawer-body li{margin:6px 0;font-size:15px}

/* 转场 */
.wipe{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden;visibility:hidden}
.wipe.run{visibility:visible}
.wipe i{position:absolute;top:-20%;bottom:-20%;left:-30%;width:160%;transform:translateX(-130%) skewX(-20deg)}
.wipe .w1{background:var(--pink)}
.wipe .w2{background:#000;left:-25%}
.wipe .w3{background:#fff;width:14%;left:40%}
.wipe.run .w1{animation:wipe 1.3s cubic-bezier(.75,0,.2,1) both}
.wipe.run .w2{animation:wipe 1.3s cubic-bezier(.75,0,.2,1) .07s both}
.wipe.run .w3{animation:wipeS 1.3s cubic-bezier(.75,0,.2,1) .1s both}
@keyframes wipe{0%{transform:translateX(-130%) skewX(-20deg)}38%,64%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(130%) skewX(-20deg)}}
@keyframes wipeS{0%{transform:translateX(-900%) skewX(-20deg)}38%,64%{transform:translateX(260%) skewX(-20deg)}100%{transform:translateX(900%) skewX(-20deg)}}
.wipe-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0}
.wipe.run .wipe-t{animation:wipeT 1.3s ease both}
.wipe-t small{font-size:18px;font-weight:900;background:var(--pink);padding:2px 16px;transform:skewX(-12deg)}
.wipe-t b{font-size:clamp(44px,9vw,92px);font-weight:900;line-height:1.1;margin-top:10px;text-shadow:6px 6px 0 var(--pink)}
@keyframes wipeT{0%,30%{opacity:0;transform:scale(1.35)}40%,62%{opacity:1;transform:scale(1)}74%,100%{opacity:0;transform:scale(.96)}}

/* ===== 通用 ===== */
.rv{animation:rv .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes rv{from{opacity:0;transform:translateX(-26px) skewX(-8deg)}to{opacity:1;transform:none}}
.pop{animation:pop .45s cubic-bezier(.2,1.5,.35,1) both;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.stampin{animation:stamp .5s cubic-bezier(.2,1.35,.3,1) both;animation-delay:var(--d,0ms)}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.flip{animation:flip .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms);transform-origin:50% 50%}
@keyframes flip{0%{opacity:0;transform:perspective(600px) rotateY(-90deg)}100%{opacity:1;transform:perspective(600px) rotateY(0)}}
.shake{animation:shake .45s both}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.still .rv,.still .pop,.still .stampin,.still .flip,.still .shake,.still.rv,.still.pop{animation:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

.tag{display:inline-block;background:var(--pink);color:var(--on-pink);font-weight:900;padding:2px 12px;transform:skewX(-10deg);line-height:1.5;white-space:nowrap}
.tag>span{display:inline-block;transform:skewX(10deg)}
.tag.dark{background:var(--ink);color:var(--on-ink)}
.tag.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.tag.big{font-size:22px;padding:4px 20px}
.tag.holo{background:linear-gradient(100deg,#ff5fae,#ffd46b 40%,#8ff3ff 70%,#d3a8ff);color:#000}
.kick{display:inline-block;font-size:14px;font-weight:900;background:var(--pink);color:#fff;padding:2px 12px;transform:skewX(-10deg);margin-bottom:10px}
.kick>span{display:inline-block;transform:skewX(10deg)}
.h-tab{display:flex;align-items:stretch;margin:0 0 14px;font-size:26px;font-weight:900;line-height:1}
.h-tab span{background:var(--ink);color:var(--on-ink);padding:10px 30px 10px 18px;clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.h-tab::after{content:"";flex:1;border-bottom:7px solid var(--pink);margin-left:-10px}
.h3{margin:0 0 10px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
.h3::before{content:"";width:12px;height:18px;background:var(--pink);transform:skewX(-14deg)}
.box{background:var(--paper);border:3px solid var(--ink);padding:16px 18px}
.box+.box{margin-top:14px}
.lead{font-size:20px;font-weight:700;line-height:1.6;margin:0 0 12px}
.lead b,.pts b,.prose b,.mini b{color:var(--pink);font-weight:900}
.prose p{margin:0 0 12px;font-size:16px;line-height:1.85}
.prose p:last-child{margin-bottom:0}
.pts{margin:0;padding:0;list-style:none}
.pts li{position:relative;padding:7px 0 7px 24px;border-bottom:2px solid var(--line);font-size:16px}
.pts li:last-child{border-bottom:0}
.pts li::before{content:"";position:absolute;left:3px;top:16px;width:11px;height:11px;background:var(--pink);transform:skewX(-14deg)}
.mini{font-size:14px;color:var(--muted);margin:8px 0 0}
.seg-sw{display:inline-grid;grid-auto-flow:column;border:3px solid var(--ink)}
.seg-sw button{border:0;border-right:3px solid var(--ink);background:var(--paper);font-weight:900;padding:6px 14px;min-height:40px;cursor:pointer}
.seg-sw button:last-child{border-right:0}
.seg-sw button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.btn{border:3px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:900;padding:8px 16px;min-height:44px;cursor:pointer}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.line{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== 页面 ===== */
.page{position:absolute;inset:0;overflow-y:auto;padding:28px 24px 48px;background:var(--bg)}
.page::before{content:"";position:fixed;right:-120px;top:40px;width:420px;height:140%;background:repeating-linear-gradient(-60deg,transparent 0 22px,rgba(240,22,125,.06) 22px 30px);pointer-events:none;transform:skewX(-18deg)}
.pg{max-width:1120px;margin:0 auto;position:relative}
.pg.narrow{max-width:820px}
.pg.center{text-align:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:20px}
.cover-band{background:#000;color:#fff;padding:34px 48px 30px;position:relative;box-shadow:14px 14px 0 var(--pink);max-width:92vw}
.cover-band small{display:inline-block;font-size:16px;font-weight:900;background:var(--pink);padding:2px 14px;transform:skewX(-12deg)}
.cover-band h1{margin:12px 0 6px;font-size:clamp(34px,6.4vw,70px);line-height:1.1;font-weight:900}
.cover-band p{margin:0;font-size:18px;font-weight:700;color:#d9d9de}
.cover-hint{font-weight:900;font-size:15px;color:var(--muted)}
.big{font-size:22px;font-weight:700;line-height:1.6;margin:0 0 16px}
.slam{display:inline-block;font-size:clamp(30px,5vw,52px);font-weight:900;line-height:1.2;background:var(--pink);color:#fff;padding:6px 26px;transform:rotate(-3deg);box-shadow:8px 8px 0 var(--ink);margin:6px 0 26px}
.slam.huge{font-size:clamp(34px,6.5vw,68px)}
.duo{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}
.duo-x{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);background:var(--paper);padding:10px 20px;font-size:24px;font-weight:900}
.duo-x s{color:var(--muted);text-decoration-thickness:4px;text-decoration-color:var(--pink)}
.duo-x::after{content:none}
.duo-x b{color:var(--pink)}
.tl{position:relative;margin:4px 0 0;padding-left:34px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:5px;background:var(--ink)}
.tl-i{position:relative;margin-bottom:14px}
.tl-i::before{content:"";position:absolute;left:-31px;top:8px;width:18px;height:18px;background:var(--pink);border:3px solid var(--ink);transform:rotate(45deg)}
.tl-i b{display:block;font-size:19px;font-weight:900}
.tl-i p{margin:2px 0 0;font-size:15px;line-height:1.75;color:var(--ink)}
.tl-i.worst b{color:var(--pink)}
.goal{border:3px solid var(--ink);background:var(--paper);padding:14px 16px;position:relative}
.goal em{position:absolute;top:-16px;left:12px;font-style:normal;font-size:30px;font-weight:900;color:var(--pink);background:var(--bg);padding:0 6px;line-height:1}
.goal p{margin:6px 0 0;font-size:16px;line-height:1.75}
.bb{display:grid;grid-template-columns:1fr 2.2fr;max-width:640px;margin:0 auto 22px;border:4px solid var(--ink)}
.bb>div{padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bb b{font-size:22px;font-weight:900}
.bb-fair{background:var(--pink);color:#fff}
.bb-black{background:#000;color:#fff;background-image:repeating-linear-gradient(45deg,#000 0 10px,#141417 10px 20px)}
.pg.center .prose{text-align:left}
.truths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.truth{background:#000;color:#fff;padding:18px 16px 16px;box-shadow:7px 7px 0 var(--pink);text-align:left}
.truth b{display:block;font-size:26px;font-weight:900;margin-bottom:6px}
.truth p{margin:0;font-size:15px;line-height:1.7;color:#e2e2e6}
.chev{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px}
.chev span{background:var(--ink);color:var(--on-ink);font-weight:900;padding:8px 22px 8px 16px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);font-size:16px}
.chev span:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.chev span.hot{background:var(--pink);color:#fff}

/* 才能卡 */
.tc{background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--pink);padding:18px 18px 16px}
.tc-name{font-size:34px;font-weight:900;line-height:1.2;margin:8px 0 14px}
.tc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tc-slot{border:3px dashed var(--line);min-height:112px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.tc-slot.on{border:3px solid var(--ink);background:var(--paper)}
.tc-slot small{font-size:12px;font-weight:900;color:var(--muted)}
.tc-slot b{font-size:20px;font-weight:900;line-height:1.3}
.tc-slot p{margin:0;font-size:14px;line-height:1.5}
.tc-slot.battle{border-color:var(--pink);box-shadow:inset 0 0 0 2px var(--pink)}
.tc-slot .mark{position:absolute;top:-12px;right:8px}
.tc-lim{margin-top:10px;border:3px solid var(--ink);background:#000;color:#fff;padding:10px 12px;min-height:66px}
.tc-lim.empty{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted)}
.tc-lim small{font-size:12px;font-weight:900;color:#bbb}
.tc-lim b{display:block;font-size:17px;font-weight:900}
.form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.form-x{border:3px solid var(--ink);padding:10px 12px;cursor:pointer;background:var(--paper);text-align:left;font-weight:700}
.form-x[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.form-x code{font-family:inherit;background:var(--pink);color:#fff;padding:0 6px;font-weight:900}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink)}
.cmp>div{padding:14px}
.cmp>div+div{border-left:3px solid var(--ink);background:var(--pink-soft)}
.cmp small{display:block;font-weight:900;font-size:13px;margin-bottom:4px}
.cmp p{margin:0;font-size:17px;font-weight:700;line-height:1.6}
.act{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.act .step{border:3px solid var(--ink);padding:6px 12px;font-weight:900;background:var(--paper)}
.act .arrow{font-weight:900;color:var(--pink)}
.lim-card{border:3px solid var(--ink);background:var(--paper);padding:14px 16px}
.lim-card b{font-size:22px;font-weight:900}
.lim-card p{margin:6px 0 0;font-size:15px}
.icon-x{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;background:var(--ink);color:var(--on-ink);font-weight:900;font-size:20px;margin-right:8px;flex:none}
.slot3{display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--ink);margin-top:10px}
.slot3>div{padding:10px;border-right:2px solid var(--line);text-align:center}
.slot3>div:last-child{border-right:0}
.slot3 small{display:block;font-size:13px;font-weight:900;color:var(--muted)}
.slot3 b{font-size:30px;font-weight:900;line-height:1.2}
.slot3 .hot{background:var(--pink);color:#fff}
.slot3 .hot small{color:#fff}
.slot3 .lock{background:repeating-linear-gradient(45deg,var(--field) 0 8px,var(--paper) 8px 16px)}
.toggles{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0}

/* 属性 */
.at-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.at-panel{background:var(--paper);border:4px solid var(--ink);padding:18px;position:relative;overflow:hidden}
.at-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.at-name{font-size:30px;font-weight:900;min-width:70px}
.dots{display:flex;gap:10px}
.dot{width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;transition:transform .15s}
.dot:hover{transform:scale(1.08)}
.dot.on{background:var(--pink)}
.dot:disabled{opacity:.3;cursor:not-allowed}
.at-big{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.at-big span{font-size:16px;font-weight:900}
.at-big b{font-size:72px;font-weight:900;line-height:1;color:var(--pink)}
.pips{display:flex;gap:6px}
.pips i{width:30px;height:30px;background:var(--pink);border:3px solid var(--ink);transform:skewX(-12deg)}
.pips i.lost{background:transparent;border-style:dashed}
.unlocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
.un{border:3px dashed var(--line);padding:10px 12px;color:var(--muted);position:relative;min-height:84px}
.un small{display:block;font-size:12px;font-weight:900}
.un b{display:block;font-size:18px;font-weight:900}
.un p{margin:2px 0 0;font-size:14px;line-height:1.5}
.un.on{border:3px solid var(--ink);color:var(--ink);background:var(--paper)}
.un.on b{color:var(--pink)}
.un.fx{animation:unlock .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes unlock{0%{transform:scale(.7) rotate(-4deg);background:var(--pink)}60%{transform:scale(1.06) rotate(1deg)}100%{transform:none}}
.bigstamp{position:absolute;right:18px;top:16px;font-size:38px;font-weight:900;color:var(--pink);border:5px solid var(--pink);padding:0 14px;transform:rotate(-8deg);background:var(--paper);pointer-events:none}
.carry{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.carry i{width:46px;height:46px;border:3px solid var(--ink);background:var(--field);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900}
.carry i.new{animation:pop .4s cubic-bezier(.2,1.5,.35,1) both}
.qn{display:flex;align-items:baseline;gap:8px;margin:12px 0 0}
.qn b{font-size:56px;font-weight:900;color:var(--pink);line-height:1}
.ab-demo{margin-top:8px;font-size:14px;color:var(--ink)}
.ripple{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--pink);animation:rip 1.4s infinite}
@keyframes rip{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
.eyekw{background:linear-gradient(transparent 55%,rgba(240,22,125,.35) 55%);font-weight:900}
.ping{display:inline-block;background:#000;color:#fff;font-size:13px;font-weight:900;padding:2px 8px;animation:ping 1.6s infinite}
@keyframes ping{0%,100%{transform:none}10%{transform:translateY(-3px)}20%{transform:none}}
.g16{display:grid;grid-template-columns:repeat(4,26px);gap:3px;margin-top:6px}
.g16 span{width:26px;height:26px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.g16 span.sel{background:var(--pink);color:#fff;border-color:var(--pink)}
.sparkles{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,95,174,.18),rgba(255,212,107,.2) 45%,rgba(143,243,255,.18) 75%,rgba(211,168,255,.2))}
.sparkles i{position:absolute;width:30px;height:30px;animation:tw 1.6s ease-in-out infinite}
.sparkles i::before,.sparkles i::after{content:"";position:absolute;left:50%;top:50%;background:#ffe27a;border-radius:50%;box-shadow:0 0 8px 2px rgba(255,200,80,.9)}
.sparkles i::before{width:5px;height:30px;margin:-15px 0 0 -2.5px}
.sparkles i::after{width:30px;height:5px;margin:-2.5px 0 0 -15px}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.itemtags{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.it{border:3px solid var(--ink);background:var(--paper);padding:12px 10px;cursor:pointer;text-align:center;font-weight:900;font-size:17px}
.it[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.it small{display:block;font-size:12px;color:var(--muted)}
.it[aria-pressed="true"] small{color:#bbb}
.itfx{border:4px solid var(--ink);background:var(--paper);padding:16px 18px;min-height:220px;position:relative;overflow:hidden}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out both;pointer-events:none}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.clue{display:inline-block;border:3px solid var(--ink);padding:2px 10px;font-weight:900;margin:4px 6px 0 0;background:var(--pink-soft)}
.vial{display:inline-block;width:34px;height:48px;border:3px solid var(--ink);border-radius:0 0 12px 12px;position:relative;overflow:hidden;vertical-align:middle}
.vial::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:var(--pink);animation:fill 1.2s ease both}
.vial.anti::after{background:#1b9a72}
@keyframes fill{from{height:0}to{height:60%}}
.gear{display:inline-block;width:36px;height:36px;border:7px dashed var(--ink);border-radius:50%;animation:spin 3s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* 羁绊 */
.bond-row{display:grid;grid-template-columns:130px 150px 1fr;gap:10px;align-items:center;border-bottom:3px solid var(--line);padding:12px 0}
.bond-row:last-child{border-bottom:0}
.bond-row .k{font-weight:900;font-size:17px}
.bond-row .k.neg{color:var(--pink)}
.bond-row .t{justify-self:start}
.bond-row p{margin:0;font-size:16px}
.libchips{display:flex;flex-wrap:wrap;gap:6px}
.libchips span{border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:14px;background:var(--paper)}
.ask{font-size:clamp(24px,3.6vw,38px);font-weight:900;line-height:1.35;background:#000;color:#fff;padding:22px 24px;box-shadow:10px 10px 0 var(--pink);margin-bottom:20px}
.ask b{color:var(--pink)}
.submit{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap;min-height:320px}
.mini-card{width:220px;background:var(--paper);border:4px solid var(--ink);padding:12px;box-shadow:8px 8px 0 var(--pink)}
.mini-card .mc-h{background:#000;color:#fff;font-weight:900;padding:2px 8px;font-size:13px}
.mini-card b{display:block;font-size:22px;font-weight:900;margin:8px 0 4px}
.mini-card i{display:block;height:8px;background:var(--line);margin:6px 0}
.mini-card.fly{animation:flyc 1.1s cubic-bezier(.6,0,.3,1) both}
@keyframes flyc{0%{transform:none}45%{transform:translate(80px,-40px) rotate(8deg) scale(.9)}100%{transform:translate(260px,10px) rotate(0) scale(.35);opacity:0}}
.gm-box{width:220px;height:200px;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:20px;position:relative}
.gm-box .ok{position:absolute;bottom:-18px;right:-14px;background:var(--pink);color:#fff;font-size:22px;padding:2px 14px;transform:rotate(-8deg)}

/* ===== 舞台（前台／后台） ===== */
.stage{position:absolute;inset:0;background:#0b0b0d;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 16px);pointer-events:none}
.stage::after{content:"";position:absolute;left:-10%;bottom:-40%;width:60%;height:90%;background:var(--pink);opacity:.14;transform:skewX(-24deg);pointer-events:none}
.front{position:absolute;left:50%;top:16px;bottom:16px;width:min(800px,calc(100% - 32px));transform:translateX(-50%);background:var(--paper);border:4px solid #000;display:flex;flex-direction:column;box-shadow:10px 10px 0 var(--pink);z-index:2}
.front-head{flex:none;display:flex;align-items:center;gap:8px;background:#000;color:#fff;padding:6px 10px;min-height:44px}
.front-head b{font-size:18px;font-weight:900;margin-right:4px}
.chip{display:inline-block;font-size:13px;font-weight:900;background:var(--pink);color:#fff;padding:1px 10px;transform:skewX(-10deg)}
.chip.w{background:#fff;color:#000}
.front.court{box-shadow:10px 10px 0 #ffd23f}
.front.court .front-head{background:var(--pink)}
.front.court .front-head .chip{background:#000}
.widget{flex:none;border-bottom:3px solid var(--ink);background:var(--field);max-height:56%;overflow:auto}
.log{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}
.back{position:absolute;right:16px;bottom:16px;width:320px;height:min(48%,380px);background:var(--paper);border:4px solid var(--pink);display:flex;flex-direction:column;z-index:6;box-shadow:6px 6px 0 #000}
.back-head{flex:none;display:flex;align-items:center;gap:8px;background:var(--pink);color:#fff;padding:4px 8px 4px 10px;min-height:38px}
.back-head b{font-weight:900;flex:1}
.back-head .ptc{font-size:13px;font-weight:900;background:#000;color:#fff;padding:0 8px;white-space:nowrap}
.back-head .ptc.bump{animation:pop .45s cubic-bezier(.2,1.5,.35,1)}
.back-tg{border:2px solid #fff;background:transparent;color:#fff;font-size:12px;font-weight:900;padding:0 6px;cursor:pointer;display:none}
.back .log{padding:10px;gap:7px}
.bwidget{flex:none;border-bottom:3px solid var(--pink);max-height:60%;overflow:auto;background:var(--field)}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:var(--c,#444);font-size:15px;border:2px solid #000}
.msg .bd{max-width:84%;min-width:0}
.msg .nm{font-size:12px;font-weight:900;color:var(--muted);line-height:1.3;margin-bottom:2px}
.msg .tx{background:var(--field);border:2px solid var(--line);padding:6px 11px;font-size:15px;line-height:1.6;word-break:break-word}
.msg.gm .av{background:#000;border-color:var(--pink)}
.msg.gm .tx{background:#000;color:#fff;border-color:#000}
.msg.me{flex-direction:row-reverse}
.msg.me .nm{text-align:right}
.msg.me .tx{background:var(--pink);border-color:var(--pink);color:#fff}
.back .msg .av{width:28px;height:28px;font-size:12px}
.back .msg .tx{font-size:14px;padding:4px 9px}
.m-sys{align-self:center;font-size:13px;font-weight:900;background:var(--ink);color:var(--on-ink);padding:2px 14px;transform:skewX(-10deg);text-align:center}
.m-note{font-size:14px;border-left:5px solid var(--pink);padding:3px 9px;background:var(--pink-soft);font-weight:700}
.m-hide{align-self:flex-start;font-size:14px;font-weight:900;border:2px dashed var(--ink);padding:3px 10px;color:var(--muted)}
.m-stamp{align-self:center;font-size:42px;font-weight:900;color:var(--pink);border:6px solid var(--pink);padding:0 22px;transform:rotate(-7deg);line-height:1.3;background:var(--paper);margin:4px 0}
.m-stamp.agree{color:#0a8f5e;border-color:#0a8f5e}
.m-bullet{align-self:center;display:flex;align-items:center;gap:0;border:3px solid #000;background:#fff;color:#000;box-shadow:5px 5px 0 var(--pink)}
.m-bullet .k{background:#000;color:#fff;font-weight:900;padding:4px 10px;font-size:13px}
.m-bullet b{padding:4px 12px;font-size:17px;font-weight:900}
.m-bullet .by{font-size:12px;font-weight:900;padding:4px 10px;border-left:2px solid #000;color:#555}
.m-card{align-self:flex-start;margin-left:44px;width:260px;border:3px solid #000;background:#fff;color:#000;box-shadow:5px 5px 0 var(--pink)}
.m-card .h{background:#000;color:#fff;font-size:12px;font-weight:900;padding:2px 8px;display:flex;justify-content:space-between}
.m-card .b{padding:8px 10px}
.m-card .n{font-size:18px;font-weight:900}
.m-card .t{display:inline-block;font-size:12px;font-weight:900;background:var(--pink);color:#fff;padding:0 6px;margin:2px 0 6px}
.m-card .tg{display:flex;flex-wrap:wrap;gap:4px}
.m-card .tg span{font-size:13px;font-weight:900;border:2px solid #000;padding:0 6px}
.m-card .tg span.btl{background:var(--pink);color:#fff;border-color:var(--pink)}
.m-card .lim{font-size:12px;margin-top:6px;border-top:2px solid #ddd;padding-top:4px}
.new{animation:msgIn .38s cubic-bezier(.2,.8,.2,1) both}
.msg.new .tx{animation:typeIn .55s steps(18,end) both}
@keyframes msgIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes typeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.m-stamp.new{animation:stamp .5s cubic-bezier(.2,1.35,.3,1) both}
.fly-bullet{position:absolute;left:-40%;top:42%;z-index:30;display:flex;align-items:center;border:3px solid #000;background:#fff;color:#000;box-shadow:6px 6px 0 var(--pink);font-weight:900;animation:flyb .8s cubic-bezier(.6,0,.2,1) both}
.fly-bullet .k{background:#000;color:#fff;padding:6px 12px;font-size:14px}
.fly-bullet b{padding:6px 16px;font-size:22px}
@keyframes flyb{0%{transform:translateX(0) skewX(-20deg)}70%{transform:translateX(95vw) skewX(-20deg)}100%{transform:translateX(95vw) skewX(0);opacity:0}}
.alarm{position:absolute;inset:0;z-index:25;pointer-events:none;background:var(--pink);animation:alarm 1.1s steps(1,end) both}
@keyframes alarm{0%{opacity:.85}15%{opacity:0}30%{opacity:.75}45%{opacity:0}60%{opacity:.5}75%,100%{opacity:0}}
.banner{position:absolute;left:0;right:0;top:36%;z-index:26;pointer-events:none;background:#000;color:#fff;text-align:center;font-size:clamp(34px,6vw,64px);font-weight:900;padding:6px 0;border-top:6px solid var(--pink);border-bottom:6px solid var(--pink);animation:banner 1.5s cubic-bezier(.7,0,.2,1) both}
@keyframes banner{0%{transform:translateX(-110%) skewX(-10deg)}30%,75%{transform:translateX(0) skewX(-10deg)}100%{transform:translateX(110%) skewX(-10deg)}}

/* 舞台小工具 */
.w-pad{padding:12px 14px}
.memo-ol{margin:0;padding-left:0;list-style:none;counter-reset:m}
.memo-ol li{position:relative;padding:7px 0 7px 38px;border-bottom:2px solid var(--line);font-size:15px;counter-increment:m}
.memo-ol li:last-child{border-bottom:0}
.memo-ol li::before{content:counter(m);position:absolute;left:0;top:7px;width:26px;height:26px;background:var(--ink);color:var(--on-ink);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.map{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;padding:12px 14px}
.rooms{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,64px);gap:6px}
.room{border:3px solid var(--ink);background:var(--paper);display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 7px;font-weight:900;font-size:14px}
.room.here{background:var(--ink);color:var(--on-ink)}
.room.done{background:var(--pink-soft)}
.pov{position:absolute;width:36px;height:36px;border-radius:50%;border:3px solid #ffd23f;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-30%);transition:left .6s cubic-bezier(.5,0,.2,1),top .6s cubic-bezier(.5,0,.2,1);z-index:2}
.pov::after{content:"主视角";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;background:#ffd23f;color:#000;padding:0 4px;white-space:nowrap;font-weight:900}
.team{display:flex;flex-direction:column;gap:6px}
.team-h{font-size:13px;font-weight:900}
.team-h b{color:var(--pink)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.tk{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #000}
.tk.empty{background:transparent;border:3px dashed var(--line)}
.gone{font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:6px}
.gone .tk{width:30px;height:30px;font-size:12px;opacity:.7}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 14px}
.why div{border:3px solid var(--ink);background:var(--paper);padding:10px;text-align:center;font-weight:900;font-size:15px}
.why div i{display:block;font-style:normal;font-size:26px;color:var(--pink)}
.sched{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px;flex-wrap:wrap}
.sched div{border:3px solid var(--ink);background:var(--paper);min-width:92px;text-align:center;padding:6px 10px}
.sched div b{display:block;font-size:40px;font-weight:900;line-height:1.1;color:var(--pink)}
.sched div span{font-size:13px;font-weight:900}
.sched em{font-style:normal;font-size:28px;font-weight:900}
.plan{display:grid;grid-template-columns:70px repeat(3,1fr);gap:4px;padding:12px 14px;font-size:13px;font-weight:900}
.plan span{border:2px solid var(--ink);background:var(--paper);min-height:38px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:2px}
.plan span.h{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.plan .tk{width:24px;height:24px;font-size:11px;border-width:2px}
.studio{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:center}
.studio-win{border:3px dashed var(--ink);background:var(--paper);padding:8px;display:flex;flex-direction:column;gap:6px}
.studio-win .tt{font-size:12px;font-weight:900;color:var(--muted)}
.studio-flow{display:flex;flex-direction:column;gap:6px;font-weight:900;font-size:14px}
.studio-flow span{border:3px solid var(--ink);padding:4px 10px;background:var(--paper)}
.studio-flow .ok{background:var(--pink);color:#fff;border-color:var(--pink)}
.studio-flow .ng{border-style:dashed;color:var(--muted)}
.shop{padding:8px}
.shop-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;margin-bottom:6px}
.shop-h b{color:var(--pink);font-size:16px}
.shop-list{display:flex;flex-direction:column;gap:5px}
.shop-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--paper);padding:4px 8px;font-size:13px;font-weight:900;cursor:pointer;text-align:left}
.shop-list button:hover{background:var(--ink);color:var(--on-ink)}
.shop-list button:disabled{opacity:.4;cursor:not-allowed}
.shop-list em{font-style:normal;color:var(--pink)}
.scenes{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.scene-list{display:flex;gap:6px;flex-wrap:wrap}
.scene-list span{border:3px solid var(--ink);background:var(--paper);padding:4px 14px;font-weight:900}
.scene-list span.on{background:var(--ink);color:var(--on-ink)}
.topics{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:900;font-size:14px}
.desc{padding:12px 14px}
.desc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.desc-h b{font-size:18px;font-weight:900}
.desc-t{font-size:16px;line-height:1.9;background:var(--paper);border:3px solid var(--ink);padding:10px 14px}
.kw{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:default}
.eye .kw{background:linear-gradient(transparent 50%,rgba(240,22,125,.4) 50%);font-weight:900;cursor:pointer;animation:kwOn .6s both;animation-delay:var(--d,0ms)}
.eye .kw.noted{background:var(--pink);color:#fff}
@keyframes kwOn{0%{background-size:0 100%}100%{background-size:100% 100%}}
.seats{display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}
.seat{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:900;width:70px;transition:opacity .3s,filter .3s}
.seat .tk{width:46px;height:46px}
.seat.mute{opacity:.35;filter:grayscale(1)}
.seat.mute em{font-style:normal;font-size:11px;background:#000;color:#fff;padding:0 4px}
.seat.talk .tk{box-shadow:0 0 0 4px var(--pink);animation:ping 1.6s infinite}
.vote{padding:12px 14px}
.vote-q{font-weight:900;font-size:17px;margin-bottom:8px}
.vote-opts{display:flex;flex-direction:column;gap:6px}
.vote-opt{position:relative;display:flex;align-items:center;justify-content:space-between;border:3px solid var(--ink);background:var(--paper);padding:6px 12px;font-weight:900;cursor:pointer;overflow:hidden;text-align:left}
.vote-opt i{position:absolute;left:0;top:0;bottom:0;background:var(--pink-soft);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1);z-index:0}
.vote-opt span,.vote-opt b{position:relative;z-index:1}
.vote-opt.win{border-color:var(--pink)}
.vote-opt.win i{background:var(--pink)}
.vote-opt.win span,.vote-opt.win b{color:#fff}
.vote-opt[aria-pressed="true"]{outline:3px solid #ffd23f}

/* ===== 死凶对决 ===== */
.bt{position:absolute;inset:0;overflow-y:auto;background:#0b0b0d;color:#fff;padding:14px 16px 26px}
.bt::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px);pointer-events:none}
.bt-in{max-width:1180px;margin:0 auto;position:relative}
.bt-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:thin}
.bt-tabs button{flex:none;border:2px solid #fff;background:transparent;color:#fff;font-weight:900;font-size:14px;padding:4px 12px;cursor:pointer}

</div>
<script>
(function(){
"use strict";
/* ===== 共用 ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=(t,c='')=>`<span class="tag ${c}"><span>${t}</span></span>`;
const D=ms=>`style="--d:${ms}ms"`;
const sg=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);

const PC={
  shiori:{n:'朝雾诗织',s:'诗',c:'#f0167d'},
  moe:{n:'早乙女萌',s:'萌',c:'#d98a00'},
  kujo:{n:'九条刚',s:'九',c:'#3553d6'},
  hide:{n:'森秀人',s:'森',c:'#15936c'},
  yuki:{n:'柊由纪',s:'柊',c:'#8a4fd8'}
};
const CARDS={
  moe:{title:'超高校级的偶像',tags:['歌唱','舞台表现','读空气'],lim:'嗓子哑掉时无法发动'},
  kujo:{title:'超高校级的剑道家',tags:['剑术','心眼','体能'],battle:'剑术',lim:'手里没有长条物时，【剑术】无法发动'},
  hide:{title:'超高校级的钢琴家',tags:['演奏','绝对音感','指力'],lim:'双手受伤时无法发动'},
  yuki:{title:'超高校级的药剂师',tags:['药理','调剂','急救'],lim:'手边没有药品或器材时无法发动'}
};
const gm=x=>({t:'gm',x}), sys=x=>({t:'sys',x}), me=x=>({t:'me',x}), pc=(k,x)=>({t:'pc',k,x}),
      note=x=>({t:'note',x}), card=k=>({t:'card',k}), stamp=(x,c='')=>({t:'stamp',x,c}), bullet=(x,by)=>({t:'bullet',x,by}),
      hid=(k,x)=>({t:'hide',k,x});

/* ===== 开场 ===== */
const HIST=[
  ['一开始它是 PVP','凶手面对的是与其他所有玩家的案件比拼，敢下手的凶手都是抱着要赢的态度来的。于是出现特别冷门的物理学知识、特别绕的诡计逻辑，而主持人没有办法在双方之间做平衡。'],
  ['第一次改革：转向 PVE','凶手设计一个案件去挑战所有人，重点在演出叙事，塑造凶手与侦探的弧光。'],
  ['新问题：没有人愿意当凶手','因为不管当死者还是当凶手，最后都要面对同一件事：本章节淘汰。'],
  ['于是提高凶手待遇、降低死者体验','自愿当凶手就有特权：不会被其他凶手杀、有更多剧情体验、有专门设计的地图环境。为了让案件顺利进行，主持人甚至只能用黑箱去满足案件的要求。'],
  ['最糟的情况：凶手的话语权大于主持人','最早的时候，弹丸论破 TRPG 对死者的态度是无奈但尊重的，特别是第一章死者，没有游戏体验，纯粹一轮游。而凶手的话语权被放大之后，已经到了想杀谁就杀谁、就算牵扯私人恩怨也可以的程度。有能力的主持人可以从中把控平衡，但只要主持人稍微偏差，就会出现场外纠纷，甚至引发连锁反应。']
];
const S_INTRO={id:'intro',type:'page',kick:'序章',title:'开场',
rules:[['参与须知',[
  '这是一场关于杀人、背叛与死亡的游戏。角色可能成为死者或凶手，死亡的玩家在大部分的场合，是退出本局游戏。',
  '特别是首位死者，可能只有很短的参与时间，参团前请确认自己能接受这种机制。',
  '主持人可以调度剧情、资源与情报等任何资源，以确保团的稳定性。',
  '本规则中仅有【死凶对抗】的裁定会高于主持人。',
  '弹丸论破 TRPG，失忆与揭露世界观真相是常态，因此玩家写下的背景，可能由主持人补完、合并，甚至在故事中揭露玩家不知道的记忆，请确定自己可以接受这种模式。',
  '凶手依案件与角色动机来选择目标，请不要借游戏处理场外的私人恩怨。',
  '出现争议时，由主持人裁定；仅有死凶对抗规则，严格按照裁定处理。']]],
steps:[
{cap:'这是一份边看边玩的规则书：跟着一场案件，从创角一路走到学级裁判与死凶对决。点<b>「下一步」</b>前进，左上角<b>「目录」</b>可以跳到任何一段。这是<b>完整版（主持人手册）</b>：标着「主持人」的步骤是操作说明，玩家只想知道怎么玩的话，看另一份玩家手册就够了。',
 view:()=>`<div class="cover"><div class="cover-band rv"><small>超高校级才能者</small><h1>弹丸论破跑团规则书</h1><p>自相残杀学园　叙事型标签规则</p></div><div class="cover-hint rv" ${D(350)}>按「下一步」，或按键盘 → 开始</div></div>`},
{cap:'弹丸论破 TRPG 跟一般的跑团不一样。',
 view:()=>`<div class="pg narrow center"><span class="kick rv"><span>制作者前言</span></span>
 <p class="big rv" ${D(80)}>如果你是因为喜欢弹丸论破才翻开这本书，我要先把丑话说在前面：</p>
 <div class="slam stampin" ${D(420)}>这个团跑起来非常痛苦。</div>
 <div class="duo rv" ${D(760)}><div class="duo-x"><s>数值型</s><b>叙事型</b></div><div class="duo-x"><s>PVP</s><b>PVE</b></div></div>
 <div class="prose rv" ${D(950)}><p>它不是 PVP 数值型的 TRPG，相反，弹丸 TRPG 是 <b>PVE 叙事型</b>。最常见的误解，是把它当成一个十二至十六人的 PVP 版 CoC，这是极度错误的理解，<b>为此有大量的新人主持人在此踩坑</b>。</p></div></div>`},
{cap:'两个根本问题：骰子会毁掉推理，案件又无法复制。',
 view:()=>`<div class="pg two"><div class="box rv"><h3 class="h3">为什么骰子在这里不管用</h3><div class="prose"><p>推理对抗走的是金田一式的本格推理。本格推理的前提是线索完整呈现，玩家才有推理的立场。带有 PVP 性质的线索隐瞒、用掷骰决定查不查得到东西，在这个框架下是不可行的。</p><p>确实有主持人认真细心到可以把骰子调查跑好，但那不具备可推广性。<b>一套需要主持人天赋才能运转的规则，不是规则。</b></p></div></div>

function tcard(o){
  const pos=[0,1,2].map(i=>{
    const p=o.pos[i], on=i<o.show;
    if(!on) return `<div class="tc-slot"><small>正向才能 ${i+1}</small></div>`;
    return `<div class="tc-slot on ${p.battle?'battle':''} ${o.flip?'flip':''}" ${D(180+i*300)}><small>正向才能 ${i+1}</small><b>【${p.t}】</b><p>${p.d}</p>${p.battle?`<span class="mark">${T('战斗')}</span>`:''}</div>`;
  }).join('');
  const lim=o.lim?`<div class="tc-lim ${o.flipLim?'flip':''}" ${D(200)}><small>限制条件</small><b id="limText">${o.lim}</b></div>`:`<div class="tc-lim empty"><small>限制条件</small></div>`;
  return `<div class="tc rv"><span class="tag big"><span>${o.title}</span></span><div class="tc-name">${o.name}</div><div class="tc-grid">${pos}</div>${lim}</div>`;
}

function bindAttr(root,kind){
  const wrap=$('#atWrap',root);

const count=g=>g.type==='battle'?g.flat.length:g.steps.length;
let MODE='gm', VIEW=[];
function buildView(){
  VIEW=SEGS.map(g=>{
    if(g.type==='battle'){
      const cases=g.cases.map(c=>Object.assign({},c,{steps:c.steps.filter(s=>MODE==='gm'||!s.gm)})).filter(c=>c.steps.length);
      const flat=[]; cases.forEach((c,ci)=>c.steps.forEach((s,si)=>flat.push({ci,si})));
      return Object.assign({},g,{cases:cases,flat:flat});
    }
    return Object.assign({},g,{steps:g.steps.filter(s=>MODE==='gm'||!s.gm)});
  }).filter(g=>count(g)>0);
  buildMenu();
}
function buildMenu(){
  const sheetLink=`<a class="menu-out" href="人物卡.html" target="_blank" rel="noopener"><small>附录</small><b>人物卡模板</b></a>`;

  $$('#menu [data-seg]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.seg,0)));
}
function setMode(m){
  if(m===MODE) return;
  const id=VIEW[SEG]?VIEW[SEG].id:null, st=STEP;
  MODE=m; try{localStorage.setItem(KEY+'-mode',m);}catch(e){}
  $$('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.getAttribute('data-mode')===MODE)));
  buildView();
  let i=VIEW.findIndex(g=>g.id===id); if(i<0) i=0;
  MOUNTED=-1; closePanels();
  go(i,Math.min(st,count(VIEW[i])-1),false);
}

  const st=btState(cs,f.si), prev=f.si>0?btState(cs,f.si-1):null, c=calc(st);
  const arena=s.hide?'':`<div class="arena" style="position:relative">${st.env?'<div class="water"></div>':''}${fighter(st,'a',c,prev,animate)}${midHTML(st,c,s)}${fighter(st,'b',c,prev,animate)}</div>`;
  root.innerHTML=tabs+(s.hide?'':rail)+arena+(s.extra?`<div class="extra rv" ${D(300)}>${s.extra()}</div>`:'');
  bindTabs(g);
  const at=$('.bt-tabs [aria-current="true"]',root); if(at) at.scrollIntoView({block:'nearest',inline:'center'});
  $('#bt').scrollTop=0;
  if(animate&&s.dice){ ANIM=true; rollDice(root,run); }
}
function rollDice(root,run){
  const box=$('.dice',root); if(!box) return; box.classList.add('rolling');
  const dice=$$('.die',box); const t=setInterval(()=>dice.forEach(d=>{d.textContent=1+Math.floor(Math.random()*(+d.dataset.max));}),70);
  setTimeout(()=>{ clearInterval(t); dice.forEach(d=>{d.textContent=d.dataset.v;}); box.classList.remove('rolling'); if(run===RUN) ANIM=false; },RM?0:900);
}
function bindTabs(g){ $$('.bt-tabs [data-case]').forEach(b=>b.addEventListener('click',()=>{ const ci=+b.dataset.case; go(SEG,g.flat.findIndex(x=>x.ci===ci),true); })); }
function sandbox(cs){
  let S=clone(cs.init); const log=[];
  const arena=$('#sbxArena'), ctl=$('#sbxCtl');
  const sw=(label,path,opts)=>{ const cur=path.reduce((o,k)=>o[k],S); return `<div class="sbx-row"><span>${label}</span><div class="seg-sw">${opts.map(o=>`<button type="button" data-path="${path.join('.')}" data-val='${JSON.stringify(o[1])}' aria-pressed="${JSON.stringify(cur)===JSON.stringify(o[1])}">${o[0]}</button>`).join('')}</div></div>`; };
  const onoff=(label,path)=>sw(label,path,[['关',false],['开',true]]);
  const side=(k,title)=>`<div class="sbx-side"><h4>${title}</h4>${sw('原始门槛',[k,'hp'],[['1',1],['2',2],['3',3],['4',4]])}${sw('凶器',[k,'w','v'],[['0',0],['1',1],['射击 2',2]])}${sw('才能',[k,'t','v'],[['0',0],['战斗 1',1]])}${sw('机关',[k,'m','v'],[['0',0],['1',1]])}${sw('虚弱',[k,'weak'],[['0',0],['1',1],['2',2],['3',3]])}${onoff('中毒',[k,'poison'])}${onoff('已用解毒',[k,'antidote'])}${onoff('限制成立',[k,'block'])}${onoff('机关被解除',[k,'cancelM'])}${k==='b'?onoff('预判',[k,'fore']):''}</div>`;
  const draw=(mid)=>{ const c=calc(S); arena.innerHTML=`<div class="arena">${fighter(S,'a',c,null,false)}${midHTML(S,c,mid||{check:true,noAnim:true})}${fighter(S,'b',c,null,false)}</div>`; };
  const drawCtl=()=>{ ctl.innerHTML=`<div class="sbx">${side('a','行凶方 A')}${side('b','受袭方 B')}</div><div class="sbx-row" style="margin-top:8px"><span>受袭首轮</span><div class="seg-sw"><button type="button" data-path="first" data-val="true" aria-pressed="${S.first}">是</button><button type="button" data-path="first" data-val="false" aria-pressed="${!S.first}">否</button></div></div><div class="sbx-act"><button type="button" class="btn pink" data-act="roll">掷骰一轮</button><button type="button" class="btn" data-act="reset">重置</button></div><div class="sbx-log">${log.length?log.map(x=>`<p>${x}</p>`).join(''):'<p>还没有掷骰。</p>'}</div>`;
    $$('[data-path]',ctl).forEach(b=>b.addEventListener('click',()=>{ const path=b.dataset.path.split('.'); const val=JSON.parse(b.dataset.val); let o=S; for(let i=0;i<path.length-1;i++) o=o[path[i]]; o[path[path.length-1]]=val; S.a.dead=S.b.dead=false; draw(); drawCtl(); }));
    $('[data-act="roll"]',ctl).addEventListener('click',roll); $('[data-act="reset"]',ctl).addEventListener('click',()=>{ S=clone(cs.init); log.length=0; draw(); drawCtl(); }); };
  const roll=()=>{
    if(S.a.dead||S.b.dead){ log.push('对决已经结束，按「重置」重新开始。'); drawCtl(); return; }
    const c=calc(S);
    if(c.killA||c.killB){ if(c.killA) S.a.dead=true; if(c.killB) S.b.dead=true; log.push(`第 ${S.round} 轮掷骰前：必杀成立。`); draw({check:true,verdict:c.killA&&c.killB?'同时死亡':'必杀成立',noAnim:true}); drawCtl(); return; }
    const r=n=>1+Math.floor(Math.random()*n), na=Math.max(0,c.advA), nb=Math.max(0,c.advB);
    const da=[r(10)].concat(Array.from({length:na},()=>r(4))), db=[r(10)].concat(Array.from({length:nb},()=>r(4)));
    const sa=da.reduce((x,y)=>x+y,0), sb=db.reduce((x,y)=>x+y,0);
    let v='平手'; if(sa>sb){S.b.weak++;v=`${S.b.name} 虚弱 +1`;} else if(sb>sa){S.a.weak++;v=`${S.a.name} 虚弱 +1`;}
    const c2=calc(S), ck=checkHTML(S,c2);
    if(c2.killA&&c2.killB){S.a.dead=S.b.dead=true;v+='，同时死亡';} else if(c2.killB){S.b.dead=true;v+=`，${S.b.name} 死亡`;} else if(c2.killA){S.a.dead=true;v+=`，${S.a.name} 死亡`;}
    log.push(`第 ${S.round} 轮：${sa} 对 ${sb}，${v}。`);
    const ended=S.a.dead||S.b.dead;
    const mid={dice:{a:da,b:db},ckHTML:ck,verdict:ended?(S.a.dead&&S.b.dead?'同时死亡':'必杀成立'):(sa===sb?'平手':'虚弱 +1'),vsoft:!ended,noAnim:true};
    if(!ended){ S.round++; S.first=false; }
    draw(mid); drawCtl();
  };
  draw(); drawCtl();
}

/* ---- 页面与附录 ---- */
function renderPage(g,animate){ const s=g.steps[STEP], root=$('#page'); root.classList.toggle('still',!animate); root.innerHTML=s.view(); root.scrollTop=0; if(s.bind) s.bind(root,animate); }
let APX_TAB=0;
function renderAppendix(g,animate){
  const root=$('#page'); root.classList.toggle('still',!animate);
  const draw=()=>{ root.innerHTML=`<div class="pg"><h2 class="h-tab rv"><span>附录</span></h2><div class="apx-tabs rv" ${D(100)}>${APX_TABS.map((t,i)=>`<button type="button" data-tab="${i}" aria-pressed="${i===APX_TAB}">${t[0]}</button>`).join('')}</div><div class="rv" ${D(200)}>${APX_TABS[APX_TAB][1]()}</div></div>`;
    $$('[data-tab]',root).forEach(b=>b.addEventListener('click',()=>{ APX_TAB=+b.dataset.tab; draw(); })); };
  draw();
}

/* ---- 导览 ---- */
function capOf(){ const g=VIEW[SEG]; if(g.type==='battle'){ const f=g.flat[STEP]; return g.cases[f.ci].steps[f.si].cap; } return g.steps[STEP].cap||''; }
function chrome(){
  const g=VIEW[SEG], n=count(g), last=SEG===VIEW.length-1&&STEP===n-1;
  $('#segKick').textContent=g.kick; $('#segTitle').textContent=g.title;
  $('#prog').textContent=`${STEP+1} / ${n}`;
  $('#stepbar').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<STEP?'done':i===STEP?'on':''}"></i>`).join('');
  $('#prevBtn').disabled=SEG===0&&STEP===0;
  $('#nextBtn').disabled=last;
  $('#nextBtn').textContent=last?'完':(STEP===n-1?'下一段':'下一步');
  $$('#menu button').forEach((b,i)=>b.setAttribute('aria-current',String(i===SEG)));
  var hasR=!!(g.rules&&g.rules.length);
  $('#rulesBtn').hidden=!hasR;
  $('#rulesBtn').classList.toggle('unread',hasR&&!READ.has(g.id));
  $('#rulesBtn').setAttribute('aria-label',hasR&&!READ.has(g.id)?'细则（尚未看过）':'细则');
}
function stepObj(){ const g=VIEW[SEG]; if(g.type==='battle'){ const f=g.flat[STEP]; return g.cases[f.ci].steps[f.si]; } return g.steps[STEP]||{}; }
function setCaption(animate){ const c=$('#caption'); const s=stepObj(); c.innerHTML=(s&&s.gm?'<span class="gm-only">主持人</span>':'')+capOf(); c.classList.remove('typing'); if(animate&&!RM){ void c.offsetWidth; c.classList.add('typing'); } c.scrollTop=0; }
function mount(i){
  MOUNTED=i; const g=VIEW[i];
  if(g.type==='page'||g.type==='appendix') scene.innerHTML='<div class="page" id="page"></div>';
  else if(g.type==='stage'){ scene.innerHTML=STAGE_HTML; $('#bTg').addEventListener('click',()=>{ const b=$('#back'), open=!b.classList.contains('open'); b.classList.toggle('open',open); $('#bTg').textContent=open?'收起':'展开'; $('#bTg').setAttribute('aria-expanded',String(open)); }); }
  else scene.innerHTML='<div class="bt" id="bt"><div class="bt-in" id="btIn"></div></div>';
}
function render(animate){
  RUN++; ANIM=false;
  const g=VIEW[SEG];
  setCaption(animate);
  if(g.type==='page') renderPage(g,animate);
  else if(g.type==='stage') renderStage(g,animate);
  else if(g.type==='battle') renderBattle(g,animate);
  else renderAppendix(g,animate);
  chrome();
}
function wipe(g){
  return new Promise(res=>{
    const w=$('#wipe'); $('#wipeKick').textContent=g.kick; $('#wipeTitle').textContent=g.title;
    w.classList.remove('run'); void w.offsetWidth; w.classList.add('run');
    setTimeout(()=>res('mid'),560);
    setTimeout(()=>w.classList.remove('run'),1350);
  });
}
async function go(seg,step,animate=true){
  if(BUSY) return;
  closePanels();
  const change=seg!==MOUNTED;
  SEG=seg; STEP=step; save();
  if(change){
    RUN++; ANIM=false;
    if(animate&&!RM){ BUSY=true; await wipe(VIEW[seg]); mount(seg); await new Promise(r=>setTimeout(r,280)); BUSY=false; }
    else mount(seg);
  }
  render(animate);
}
function next(){ if(BUSY) return; if(ANIM){ render(false); return; } const n=count(VIEW[SEG]); if(STEP<n-1) go(SEG,STEP+1); else if(SEG<VIEW.length-1) go(SEG+1,0); }
function prev(){ if(BUSY) return; if(STEP>0) go(SEG,STEP-1,false); else if(SEG>0) go(SEG-1,count(VIEW[SEG-1])-1,false); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({seg:SEG,step:STEP})); }catch(e){} }
function load(){ try{ const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o&&VIEW[o.seg]&&o.step>=0&&o.step<count(VIEW[o.seg])) return o; }catch(e){} return {seg:0,step:0}; }

/* ---- 目录、细则、主题 ---- */
function closePanels(){ $('#menu').classList.remove('open'); $('#drawer').classList.remove('open'); $('#scrim').hidden=true; $('#menuBtn').setAttribute('aria-expanded','false'); $('#rulesBtn').setAttribute('aria-expanded','false'); }

$('#menuBtn').addEventListener('click',()=>{ const open=!$('#menu').classList.contains('open'); closePanels(); if(open){ $('#menu').classList.add('open'); $('#scrim').hidden=false; $('#menuBtn').setAttribute('aria-expanded','true'); } });
$('#rulesBtn').addEventListener('click',()=>{ const g=VIEW[SEG]; const open=!$('#drawer').classList.contains('open'); closePanels(); if(!open) return;
  $('#drawerTitle').textContent='细则：'+g.title; $('#drawerBody').innerHTML=(g.rules||[]).map(r=>`<h4>${r[0]}</h4><ul>${r[1].map(x=>`<li>${x}</li>`).join('')}</ul>`).join('');
  $('#drawer').classList.add('open'); $('#scrim').hidden=false; $('#rulesBtn').setAttribute('aria-expanded','true');
  markRead(g.id); $('#rulesBtn').classList.remove('unread'); });
$('#drawerClose').addEventListener('click',closePanels);
$('#scrim').addEventListener('click',closePanels);
$('#nextBtn').addEventListener('click',next);
$('#prevBtn').addEventListener('click',prev);
document.addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key==='Escape'){ closePanels(); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); next(); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
});
(function theme(){
  const root=document.documentElement;
  try{ const t=localStorage.getItem(KEY+'-theme'); if(t) root.setAttribute('data-theme',t); }catch(e){}
  $('#themeBtn').addEventListener('click',()=>{ const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark'; root.setAttribute('data-theme',nx); try{localStorage.setItem(KEY+'-theme',nx);}catch(e){} });
})();

buildView();
const start=load();
go(start.seg,start.step,true);

})();
</script>
