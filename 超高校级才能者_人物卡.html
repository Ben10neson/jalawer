<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超高校级才能者 人物卡｜已迁移到 /character</title>
<meta http-equiv="refresh" content="0; url=character/">
<link rel="canonical" href="character/">
<style>
:root{
  --bg:#e8e8eb;--paper:#ffffff;--ink:#000000;--muted:#5b5b62;--pink:#f0167d;
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#050506;--paper:#17171b;--ink:#f2f2f4;--muted:#a5a5ac;--pink:#ff3b92}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--font);padding:24px}
.wrap{background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--pink);padding:28px 30px;max-width:520px;width:100%;text-align:center}
.k{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:0 0 6px}
h1{font-size:26px;font-weight:900;margin:0 0 6px;line-height:1.25}
.band{height:6px;background:var(--pink);margin:14px 0 16px}
.l{font-size:16px;font-weight:700;margin:0 0 4px}
.mini{font-size:13px;color:var(--muted);margin:6px 0 18px}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0}
.links a{display:inline-block;text-decoration:none;font-weight:900;padding:10px 18px;border:3px solid var(--ink);color:var(--ink)}
.links a.pink{background:var(--pink);border-color:var(--pink);color:#fff}
</style>
</head>
<body>
<main class="wrap">
  <p class="k">页面已迁移</p>
  <h1>超高校级才能者 人物卡</h1>
  <div class="band"></div>
  <p class="l">正在跳转到 /character …</p>
  <p class="mini">没有自动跳转就点下面的按钮。</p>
  <p class="links">
    <a class="pink" href="character/">人物卡模板</a>
    <a href="rules/">规则书</a>
  </p>
</main>
<script>location.replace('character/');</script>
</body>
</html>
